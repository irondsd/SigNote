# Local development PostgreSQL. E2E starts its own native PostgreSQL process:
# bun run test:e2e:prepare && bun run test:e2e
services:
  db:
    image: postgres:18-alpine
    container_name: signote-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: signote
      POSTGRES_PASSWORD: signote
      POSTGRES_DB: signote
    ports:
      - '5434:5432'
    volumes:
      - signote-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U signote -d signote']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  signote-db-data:
