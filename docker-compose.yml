# Local Postgres for SigNote. Two independent instances so an E2E run can
# truncate/recreate its database without touching the data you are developing
# against.
#
#   docker compose up -d          # both
#   docker compose up -d db       # dev only
#
# Ports are deliberately non-default (5432 is left free for anything else on
# the machine, 5433 is taken by another project).
services:
  db:
    image: postgres:18-alpine
    container_name: signote-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: signote
      POSTGRES_PASSWORD: signote
      POSTGRES_DB: signote
    ports:
      - '5434:5432'
    volumes:
      - signote-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U signote -d signote']
      interval: 3s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:18-alpine
    container_name: signote-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: signote
      POSTGRES_PASSWORD: signote
      POSTGRES_DB: signote_test
    ports:
      - '5435:5432'
    # Test data is disposable — keep it in a tmpfs so runs start fast and the
    # database never survives a container restart.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U signote -d signote_test']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  signote-db-data:
