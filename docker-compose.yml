# Local development PostgreSQL. E2E starts its own native PostgreSQL process:
# bun run test:e2e:prepare && bun run test:e2e
services:
  db:
    image: postgres:18-alpine
    container_name: signote-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: signote
      POSTGRES_PASSWORD: signote
      POSTGRES_DB: signote
    ports:
      - '5434:5432'
    volumes:
      - signote-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U signote -d signote']
      interval: 3s
      timeout: 3s
      retries: 20

  # Opt-in, isolated object store for rotation integration tests. The loopback
  # ports avoid other local MinIO instances on 9000/9001. These are local-only
  # credentials; neither the app's AWS environment nor production is used.
  rotation-minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: ['rotation']
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: signote-rotation-local
      MINIO_ROOT_PASSWORD: signote-rotation-local-only
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:5000,http://127.0.0.1:5000'
    ports:
      - '127.0.0.1:9100:9000'
      - '127.0.0.1:9101:9001'
    volumes:
      - signote-rotation-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  signote-db-data:
  signote-rotation-minio-data:
